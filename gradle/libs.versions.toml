[versions]
agp = "9.2.1"
android-compileSdk = "37"
android-minSdk = "24"
kotlin = "2.4.10"

android-ndk = "27.3.13750724"
kapunsdk = "1.0.0-RC13"
kotlinx-coroutines = "1.9.0"
kotlinx-io = "0.9.1"
kotlinx-serialization = "1.9.0"
mavenpublish = "0.37.0"
skie = "0.10.14"
uniffi = "1.2.3"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
skie = { module = "co.touchlab.skie:configuration-annotations", version.ref = "skie" }

# Kapun SDK KMP libraries
kapun-proximity = { module = "org.kapunsdk:kapun-proximity", version.ref = "kapunsdk" }
kapun-dcql = { module = "org.kapunsdk:kapun-dcql", version.ref = "kapunsdk" }
kapun-presentation = { module = "org.kapunsdk:kapun-presentation", version.ref = "kapunsdk" }
kapun-credentials = { module = "org.kapunsdk:kapun-credentials", version.ref = "kapunsdk" }
kapun-util = { module = "org.kapunsdk:kapun-util", version.ref = "kapunsdk" }
kapun-crypto = { module = "org.kapunsdk:kapun-crypto", version.ref = "kapunsdk" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
uniffi-plugin = { id = "ch.ubique.uniffi.plugin", version.ref = "uniffi" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenpublish" }
